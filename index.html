<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Diario de Recuerdos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mi Diario de Recuerdos</h1>
    <p>Guarda los momentos que te hacen sonreír</p>
    <button id="boton-nuevo" class="boton boton--primario">+ Nuevo recuerdo</button>
  </header>

  <main>
    <h2>Mis recuerdos</h2>
    <p id="estado-vacio" class="vacio" hidden>
      Aún no tienes recuerdos guardados. ¡Crea el primero! ✨
    </p>
    <ul id="lista-recuerdos" class="feed"></ul>
  </main>

  <dialog id="dialogo">
    <form id="formulario" method="dialog" novalidate>
      <header>
        <h2>Nuevo recuerdo</h2>
        <button type="button" data-cerrar class="cerrar" aria-label="Cerrar">×</button>
      </header>

      <div class="cuerpo">
        <label>Título <input name="titulo" required></label>
        <label>Descripción <textarea name="descripcion" required></textarea></label>

        <div class="fila">
          <label>Fecha <input type="date" name="fecha" required></label>
          <label>Categoría
            <select name="categoria" required>
              <option value="" disabled selected>Elige una categoría</option>
              <option value="Familia">Familia</option>
              <option value="Amigos">Amigos</option>
              <option value="Escuela">Escuela</option>
              <option value="Viajes">Viajes</option>
              <option value="Logros">Logros</option>
              <option value="Otros">Otros</option>
            </select>
          </label>
        </div>

        <label>Imagen (opcional, máx 2 MB)
          <input type="file" name="imagen" accept="image/*">
        </label>
        <p id="error" class="error" role="alert" hidden></p>
      </div>

      <footer>
        <button type="button" data-cerrar class="boton boton--secundario">Cancelar</button>
        <button type="submit" class="boton boton--primario">Guardar</button>
      </footer>
    </form>
  </dialog>

  <footer>
    <p>Hecho por: Mentores CCP</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
